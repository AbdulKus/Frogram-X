name: Build Frogram X

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ID: org.frogram.messenger
  APP_NAME: Frogram X
  APP_DOWNLOAD_URL: https://github.com/${{ github.repository }}/actions
  APP_SOURCES_URL: https://github.com/${{ github.repository }}
  TGX_BUILD_FLAVORS: latest
  TGX_BUILD_ABIS: arm64-v8a
  TERM: xterm

jobs:
  build:
    name: Latest ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Pull submodule LFS files
        run: |
          git lfs install
          git submodule foreach --recursive 'git lfs pull'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang git-lfs jq make perl unzip wget

      - name: Prepare API credentials, Firebase and signing
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [[ ! "$TELEGRAM_API_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Add the TELEGRAM_API_ID repository secret."
            exit 1
          fi

          TELEGRAM_API_HASH="${TELEGRAM_API_HASH,,}"
          if [[ ! "$TELEGRAM_API_HASH" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Add the 32-character TELEGRAM_API_HASH repository secret."
            exit 1
          fi
          echo "TELEGRAM_API_ID=$TELEGRAM_API_ID" >> "$GITHUB_ENV"
          echo "TELEGRAM_API_HASH=$TELEGRAM_API_HASH" >> "$GITHUB_ENV"

          KEYSTORE="$RUNNER_TEMP/frogram-x.jks"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" &&
                -n "$ANDROID_KEYSTORE_PASSWORD" &&
                -n "$ANDROID_KEY_ALIAS" &&
                -n "$ANDROID_KEY_PASSWORD" ]]; then
            if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64."
              exit 1
            fi
          else
            echo "::warning::Signing secrets are missing. This run will use an ephemeral development key."
            ANDROID_KEYSTORE_PASSWORD=android
            ANDROID_KEY_ALIAS=frogramx
            ANDROID_KEY_PASSWORD=android
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Frogram X, O=Frogram"
          fi

          KEYSTORE_PROPERTIES="$RUNNER_TEMP/keystore.properties"
          {
            echo "keystore.file=$KEYSTORE"
            echo "keystore.password=$ANDROID_KEYSTORE_PASSWORD"
            echo "key.alias=$ANDROID_KEY_ALIAS"
            echo "key.password=$ANDROID_KEY_PASSWORD"
          } > "$KEYSTORE_PROPERTIES"
          echo "KEYSTORE_FILE=$KEYSTORE_PROPERTIES" >> "$GITHUB_ENV"

          FIREBASE_CONFIG="app/google-services.json"
          if [[ -z "${GOOGLE_SERVICES_JSON_BASE64//[[:space:]]/}" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is unavailable for this pull request. Firebase is disabled for this test build."
              echo "GOOGLE_SERVICES_ENABLED=false" >> "$GITHUB_ENV"
            else
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 is required. Refusing to build a releasable Frogram X APK without Firebase push configuration."
              exit 1
            fi
          else
            if ! printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$FIREBASE_CONFIG"; then
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not valid base64."
              exit 1
            fi

            if [[ ! -s "$FIREBASE_CONFIG" ]]; then
              echo "::error::Decoded google-services.json is empty."
              exit 1
            fi

            if ! jq -e . "$FIREBASE_CONFIG" > /dev/null; then
              echo "::error::Decoded google-services.json is not valid JSON."
              exit 1
            fi

            FIREBASE_CLIENT_JSON="$(jq -c --arg package "$APP_ID" '
              .client[]? | select(.client_info.android_client_info.package_name == $package)
            ' "$FIREBASE_CONFIG" | head -n 1)"

            if [[ -z "$FIREBASE_CLIENT_JSON" ]]; then
              echo "::error::google-services.json does not contain a Firebase Android client for $APP_ID."
              exit 1
            fi

            PROJECT_NUMBER="$(jq -r '.project_info.project_number // empty' "$FIREBASE_CONFIG")"
            PROJECT_ID="$(jq -r '.project_info.project_id // empty' "$FIREBASE_CONFIG")"
            MOBILESDK_APP_ID="$(jq -r '.client_info.mobilesdk_app_id // empty' <<< "$FIREBASE_CLIENT_JSON")"
            API_KEY="$(jq -r '[.api_key[]?.current_key // empty][0] // empty' <<< "$FIREBASE_CLIENT_JSON")"

            if [[ ! "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::Firebase project_number is missing or invalid."
              exit 1
            fi
            if [[ -z "$PROJECT_ID" ]]; then
              echo "::error::Firebase project_id is missing."
              exit 1
            fi
            if [[ ! "$MOBILESDK_APP_ID" =~ ^[0-9]+:[0-9]+:android:[0-9A-Fa-f]+$ ]]; then
              echo "::error::Firebase mobilesdk_app_id is missing or invalid for $APP_ID."
              exit 1
            fi
            if [[ ! "$API_KEY" =~ ^AIza[0-9A-Za-z_-]{30,}$ ]]; then
              echo "::error::Firebase API key is missing or malformed for $APP_ID."
              exit 1
            fi

            chmod 600 "$FIREBASE_CONFIG"
            echo "GOOGLE_SERVICES_ENABLED=true" >> "$GITHUB_ENV"
            echo "Firebase config OK: package=$APP_ID project=$PROJECT_ID project_number=$PROJECT_NUMBER"
          fi

      - name: Set up Android and native dependencies
        run: |
          scripts/setup.sh
          {
            echo "app.experimental=false"
            echo "app.google_services=$GOOGLE_SERVICES_ENABLED"
            echo "app.file=Frogram-X"
          } >> local.properties

      - name: Guard releasable build Firebase state
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test "$GOOGLE_SERVICES_ENABLED" = "true" || {
            echo "::error::Firebase must be enabled for releasable builds."
            exit 1
          }
          test -s app/google-services.json || {
            echo "::error::app/google-services.json disappeared before the build."
            exit 1
          }

      - name: Build APK
        run: ./gradlew assembleLatestArm64Release --stacktrace --no-daemon

      - name: Collect APK and checksum
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp '{}' artifacts/ ';'
          test -n "$(find artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload Frogram X APK
        uses: actions/upload-artifact@v4
        with:
          name: Frogram-X-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: Frogram-X-${{ github.sha }}
          path: artifacts

      - name: Publish Frogram X release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Frogram X build ${{ github.run_number }}
          body: |
            Automatic Frogram X build from `${{ github.sha }}`.

            APK and SHA-256 checksums are attached below.
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
